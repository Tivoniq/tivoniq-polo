<script>
(() => {
'use strict';
/* ---------------------------------------------------------------------------------------------
   TIVONIQ Core Polo, size M. Pattern in millimetres (same geometry as the tech pack).
   Cloth: position-based dynamics (Verlet). Front and back panels are meshed from the flat pattern,
   sewn at shoulders, sides and sleeve seams, and drape over an invisible body (torso + arms).
--------------------------------------------------------------------------------------------- */
const MARK_WHITE = __MARK_WHITE__;
const MARK_NAVY = __MARK_NAVY__;
const COLOURS = [
  { name: 'Heather Grey',  hex: '#9BA1A9' },
  { name: 'Midnight Navy', hex: '#0B2447' },
  { name: 'Carbon',        hex: '#16191E' },
  { name: 'Slate',         hex: '#46505E' },
  { name: 'Cloud',         hex: '#E9ECEF' },
];

const K = 0.001;                                   // mm -> m
const A = 28 * Math.PI / 180, UX = Math.cos(A), UY = Math.sin(A), NX = -Math.sin(A), NY = Math.cos(A);
const G = { half: 260, spx: 225, spy: 35, neck: 82, df: 72, db: 20, armpit: 250, lenF: 700, lenB: 725, slvLen: 230, slvOpen: 185, vent: 60 };
const H1 = [G.spx + G.slvLen * UX, G.spy + G.slvLen * UY];
const H2 = [H1[0] + G.slvOpen * NX, H1[1] + G.slvOpen * NY];
const TEX_X0 = -450, TEX_Y0 = -120, TEX_MM = 900;  // flat pattern window mapped to the front texture

/* ---------- 2D pattern outlines ---------- */
const bez = (p0, p1, p2, p3, n) => { const o = []; for (let i = 0; i < n; i++) { const t = i / n, u = 1 - t;
  o.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); } return o; };
const qbz = (p0, p1, p2, n) => { const o = []; for (let i = 0; i < n; i++) { const t = i / n, u = 1 - t;
  o.push([u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]]); } return o; };
const seg = (a, b, step = 6) => { const n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / step)), o = [];
  for (let i = 0; i < n; i++) o.push([a[0] + (b[0]-a[0]) * i / n, a[1] + (b[1]-a[1]) * i / n]); return o; };

function outline(side) {
  const d = side === 'f' ? G.df : G.db, hc = side === 'f' ? G.lenF : G.lenB, hs = hc - 12, h = G.half;
  const SP = [G.spx, G.spy], U = [h, G.armpit];
  const R = [].concat(
    bez([0, d], [50, d], [G.neck, d * .5], [G.neck, 0], 20),
    seg([G.neck, 0], SP), seg(SP, H1), seg(H1, H2), seg(H2, U), seg(U, [h, hs]),
    qbz([h, hs], [h / 2, hc + 8], [0, hc], 24), [[0, hc]]);

}
function inPoly(x, y, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
  const a = P[i], b = P[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0]-a[0]) * (y-a[1]) / (b[1]-a[1]) + a[0]) c = !c; } return c; }

  for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const a = P[j], b = P[i], dx = b[0]-a[0], dy = b[1]-a[1];
    const l2 = dx*dx + dy*dy; let t = l2 ? ((x-a[0])*dx + (y-a[1])*dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const px = a[0] + dx*t, py = a[1] + dy*t, dd = (x-px)*(x-px) + (y-py)*(y-py);
    if (dd < best) { best = dd; bx = px; by = py; } } return [bx, by, Math.sqrt(best)]; }

/* ---------- mesh a panel: snapped grid ---------- */
function meshPanel(P, s) {

  for (const p of P) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const nx = Math.ceil((x1 - x0) / s) + 2, ny = Math.ceil((y1 - y0) / s) + 2;
  const gx = x0 - s, gy = y0 - s, verts = [], gid = new Int32Array(nx * ny).fill(-1), hash = new Map();
  const cell = s * 0.45, key = (x, y) => Math.floor(x / cell) + ',' + Math.floor(y / cell);
  const find = (x, y) => { const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const l = hash.get((cx+i) + ',' + (cy+j)); if (l) for (const id of l) {
      const v = verts[id]; if ((v[0]-x)*(v[0]-x) + (v[1]-y)*(v[1]-y) < cell * cell) return id; } } return -1; };
  const add = (x, y) => { let id = find(x, y); if (id >= 0) return id; id = verts.length; verts.push([x, y]);
    const k = key(x, y); (hash.get(k) || hash.set(k, []).get(k)).push(id); return id; };
  // interior first so boundary points merge into them
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const x = gx + i * s, y = gy + j * s;
    if (inPoly(x, y, P)) { const n = nearest(x, y, P); if (n[2] > s * 0.45) gid[j * nx + i] = add(x, y); } }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { if (gid[j * nx + i] >= 0) continue; const x = gx + i * s, y = gy + j * s;
    const n = nearest(x, y, P); if (n[2] < s * 0.9) gid[j * nx + i] = add(n[0], n[1]); }
  const tris = [];
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = gid[j*nx+i], b = gid[j*nx+i+1], c = gid[(j+1)*nx+i+1], d = gid[(j+1)*nx+i];
    const t = ((i + j) & 1) ? [[a, b, d], [b, c, d]] : [[a, b, c], [a, c, d]];
    for (const q of t) { if (q[0] < 0 || q[1] < 0 || q[2] < 0 || q[0] === q[1] || q[1] === q[2] || q[0] === q[2]) continue;
      const A_ = verts[q[0]], B_ = verts[q[1]], C_ = verts[q[2]];
      const area = ((B_[0]-A_[0]) * (C_[1]-A_[1]) - (C_[0]-A_[0]) * (B_[1]-A_[1])) / 2;
      if (Math.abs(area) < s * s * 0.05) continue;
      if (!inPoly((A_[0]+B_[0]+C_[0]) / 3, (A_[1]+B_[1]+C_[1]) / 3, P)) continue;
      tris.push(q); } }
  const bnd = verts.map(v => nearest(v[0], v[1], P)[2] < 2.0);
  return { verts, tris, bnd };
}

/* ---------- build the garment ---------- */
const S = 14;                                                   // grid spacing, mm
const PF = outline('f'), PB = outline('b');
const mF = meshPanel(PF, S), mB = meshPanel(PB, S);
const hsF = G.lenF - 12;
const dseg = (x, y, a, b) => { const dx = b[0]-a[0], dy = b[1]-a[1]; let t = ((x-a[0])*dx + (y-a[1])*dy) / (dx*dx + dy*dy); t = Math.max(0, Math.min(1, t));
  return Math.hypot(x - (a[0] + dx*t), y - (a[1] + dy*t)); };
const noWeld = (x, y) => { const ax = Math.abs(x); return dseg(ax, y, H1, H2) < 5 || (ax > 250 && y > hsF - G.vent); };

const px = [], py = [];                                         // flat coords per particle
const sgnP = [];                                                // +1 front, -1 back, 0 shared
const fMap = mF.verts.map((v, i) => { px.push(v[0]); py.push(v[1]); sgnP.push(1); return i; });
const fHash = new Map(); mF.verts.forEach((v, i) => { const k = Math.round(v[0] / 2) + ',' + Math.round(v[1] / 2); (fHash.get(k) || fHash.set(k, []).get(k)).push(i); });
const bMap = mB.verts.map((v, vi) => {
  if (mB.bnd[vi] && !noWeld(v[0], v[1])) { const cx = Math.round(v[0] / 2), cy = Math.round(v[1] / 2);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const l = fHash.get((cx+i) + ',' + (cy+j)); if (l) for (const id of l) {
      if (mF.bnd[id] && Math.hypot(mF.verts[id][0] - v[0], mF.verts[id][1] - v[1]) < 1.2) { sgnP[id] = 0; return id; } } } }
  px.push(v[0]); py.push(v[1]); sgnP.push(-1); return px.length - 1;
});
const N = px.length;

/* ---------- body model (metres, local frame, Y up) ---------- */
function torsoAB(yu) {
  if (yu > 0.014) return [0.056, 0.050];
  if (yu > -0.036) { const t = (0.014 - yu) / 0.050; return [0.056 + 0.134 * Math.pow(t, 1.5), 0.050 + 0.022 * t]; }
  const u = -0.036 - yu, b = u < 0.16 ? 0.072 + 0.036 * (u / 0.16) : 0.108 - 0.008 * Math.min(1, (u - 0.16) / 0.5);
  return [0.190 - 0.016 * Math.min(1, u / 0.65), b];
}
const ARM_R = 0.052, ARM_LEN = 0.262;
const ARM_P0 = [0.1973, -0.0871, 0], ARM_D = [UX, -UY, 0];

function heightField(x, y) {                                    // initial inflation of the flat pattern, mm
  const yu = -y * K, ab = torsoAB(yu), ax = Math.abs(x);
  let hb = 0; if (ax < G.half) hb = ab[1] / K * Math.cos(ax / G.half * Math.PI / 2) + 6;
  const sx = ax, rx = sx - G.spx, ry = y - G.spy; const wperp = rx * NX + ry * NY, talong = rx * UX + ry * UY;
  let ha = 0; if (talong > -40 && wperp > 0 && wperp < G.slvOpen) ha = 59 * Math.sin(Math.PI * wperp / G.slvOpen);
  return Math.max(hb, ha);
}

/* ---------- particles ---------- */
const pos = new Float32Array(3 * N), prev = new Float32Array(3 * N), inv = new Float32Array(N).fill(1);

for (let i = 0; i < N; i++) {
  const z = sgnP[i] * heightField(px[i], py[i]);
  pos[3*i] = px[i] * K; pos[3*i+1] = -py[i] * K; pos[3*i+2] = z * K;
  prev.set(pos.subarray(3*i, 3*i+3), 3*i);
  // pin the shoulder seam (shared particles on the shoulder line)
  if (sgnP[i] === 0 && dseg(Math.abs(px[i]), py[i], [G.neck, 0], [G.spx, G.spy]) < 2.5 && Math.abs(px[i]) >= G.neck - 1) {
    pinned[i] = 1; inv[i] = 0; pos[3*i+2] = 0; prev[3*i+2] = 0; anchor.set(pos.subarray(3*i, 3*i+3), 3*i); }
}

/* ---------- constraints ---------- */
const cs = [], bs = [], eMap = new Map();
const mapTri = (tri, map) => tri.map(v => map[v]);
const okTri = t => t[0] !== t[1] && t[1] !== t[2] && t[0] !== t[2];
const panels = [{ t: mF.tris.map(t => mapTri(t, fMap)).filter(okTri), flat: mF.verts, map: fMap, sgn: 1 }, { t: mB.tris.map(t => mapTri(t, bMap)).filter(okTri), flat: mB.verts, map: bMap, sgn: -1 }];
const triAll = [];
for (const pn of panels) { const lp = new Map();
  pn.t.forEach(t => { triAll.push(t);
    for (let e = 0; e < 3; e++) { const a = t[e], b = t[(e+1)%3], o = t[(e+2)%3], k = a < b ? a * N + b : b * N + a;
      if (!eMap.has(k)) { eMap.set(k, 1); cs.push([a, b]); }
      (lp.get(k) || lp.set(k, []).get(k)).push([o, a, b]); } });
  for (const [k, l] of lp) if (l.length === 2) bs.push([l[0][0], l[1][0]]); }

let nC = cs.length, nB = bs.length, nCon = nC + nB;
let cA = new Int32Array(nCon), cB = new Int32Array(nCon), cL = new Float32Array(nCon), cK = new Float32Array(nCon);

const soft = i => py[i] < 110 && Math.abs(px[i]) < 150;      // neck and yoke: the body is rounder than the flat pattern, let it stretch
cs.forEach((c, i) => { cA[i] = c[0]; cB[i] = c[1]; cL[i] = dist2(c[0], c[1]); cK[i] = (soft(c[0]) && soft(c[1])) ? 0.22 : 1; });
bs.forEach((c, i) => { const j = nC + i; cA[j] = c[0]; cB[j] = c[1]; cL[j] = dist2(c[0], c[1]); cK[j] = 0.04; });
let triA = new Int32Array(triAll.length * 3); triAll.forEach((t, i) => { triA[3*i] = t[0]; triA[3*i+1] = t[1]; triA[3*i+2] = t[2]; });

/* ---------- simulation ---------- */
const state = { yaw: 0, goal: 0, rate: 0, wind: false, t: 0, rootY: 0, dRoot: 0, shakeT: 9, lastInput: 0 };
const acc = new Float32Array(3 * N);
let cosY = 1, sinY = 0, dYaw = 0, stepN = 0;
const GRAV = -9.81, DAMP = 0.9972, ITERS = 6, MAX_RATE = 2.6, MAX_ACC = 16, MAXD = 0.009;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BEND_K = 0.04;                                            // soft cotton: bends easily

function aero(h, wind) {                                        // air drag + wind pressure on every triangle (only while the breeze is on)
  acc.fill(0);
  for (let t = 0; t < nTri; t++) { const a = triA[3*t], b = triA[3*t+1], c = triA[3*t+2];
    const ax = pos[3*a], ay = pos[3*a+1], az = pos[3*a+2], bx = pos[3*b] - ax, by = pos[3*b+1] - ay, bz = pos[3*b+2] - az, cx = pos[3*c] - ax, cy = pos[3*c+1] - ay, cz = pos[3*c+2] - az;
    let nx = by * cz - bz * cy, ny = bz * cx - bx * cz, nz = bx * cy - by * cx; const m = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1; const area = m / 2; nx /= m; ny /= m; nz /= m;
    const k = 1 / (3 * h), vx = ((pos[3*a] - prev[3*a]) + (pos[3*b] - prev[3*b]) + (pos[3*c] - prev[3*c])) * k, vy = ((pos[3*a+1] - prev[3*a+1]) + (pos[3*b+1] - prev[3*b+1]) + (pos[3*c+1] - prev[3*c+1])) * k, vz = ((pos[3*a+2] - prev[3*a+2]) + (pos[3*b+2] - prev[3*b+2]) + (pos[3*c+2] - prev[3*c+2])) * k;
    const rn = (wind[0] - vx) * nx + (wind[1] - vy) * ny + (wind[2] - vz) * nz;
